# Routes incoming Traefik HTTP requests to the site service.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argotest
  namespace: argotest
spec:
  ingressClassName: traefik
  rules:
    # Match requests for any host at the site root.
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argotest
                port:
                  name: http
