apiVersion: apps/v1
kind: Deployment
metadata:
  name: argotest
  namespace: argotest
spec:
  selector:
    matchLabels:
      app: argotest
  template:
    metadata:
      labels:
        app: argotest
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: argotest
      containers:
        - name: nginx
          image: nginx:1.30.5-alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: web-content
              mountPath: /usr/share/nginx/html
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: web-content
          configMap:
            name: argotest-page
