# Scales the deployment between three and six replicas based on CPU use.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: argotest
  namespace: argotest
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: argotest
  minReplicas: 3
  maxReplicas: 6
  metrics:
    # Target an average CPU utilization of 50% of requested CPU.
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
  behavior:
    scaleDown:
      # Avoid rapid scale-downs after a temporary drop in demand.
      stabilizationWindowSeconds: 60
